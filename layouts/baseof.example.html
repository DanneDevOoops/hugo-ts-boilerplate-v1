<!-- Example Hugo template showing how to include the bundled TypeScript/JavaScript -->
<!-- This would typically go in your layouts directory, e.g., layouts/baseof.html -->

<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    {{ partial "head" . }}
  </head>
  <body>
    {{ partial "header" . }}


    <main>
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer" . }}


    <!-- Include your compiled TypeScript bundle -->
    <!-- The file is generated by: bun run build:ts -->
    <script src="{{ "js/main.js" | relURL }}" defer></script>

    <!-- Alternative: If you want to add the TypeScript directly in config -->
    <!-- In config/_default/hugo.toml, add: -->
    <!-- [build] -->
    <!--   [build.outputs] -->
    <!--     home = ["HTML", "RSS", "JSON"] -->
  </body>
</html>
