name: Publish TypeDoc to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies using Bun
        run: bun install --dev --frozen-lockfile

      - name: Create required directory for coverage badge output
        run: |
          mkdir -p ./docs/typedoc/badges
          touch ./docs/typedoc/badges/typedoc-coverage.json

      - name: Build TypeDoc html site
        run: bun run docs

      - name: Verify TypeDoc html output exists
        run: |
          if [ ! -d "docs/typedoc/html" ]; then
            echo "Expected docs/typedoc/html to exist, but it was not generated."
            echo "Check typedoc outputs in typedoc.config.mjs and previous build logs."
            exit 1
          fi

      - name: Upload TypeDoc artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/typedoc/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
