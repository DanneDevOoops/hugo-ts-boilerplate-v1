name: Pull Request

on:
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (PR/Dispatch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Build site
        run: bun run build:all

      - name: Upload coverage artifact (current branch)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-current
          path: docs/coverage/

  baseline-main:
    name: Baseline Coverage (main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage artifact (main baseline)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: docs/coverage/

  report-coverage:
    name: Report Coverage Comparison
    if: github.event_name == 'pull_request'
    needs: [build-and-test, baseline-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download current coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-current
          path: pr-coverage

      - name: Download main coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-main
          path: main-coverage

      - name: Comment coverage report on PR
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: pr-coverage/coverage-summary.json
          json-summary-compare-path: main-coverage/coverage-summary.json
          json-final-path: pr-coverage/coverage-final.json
          comment-on: pr

