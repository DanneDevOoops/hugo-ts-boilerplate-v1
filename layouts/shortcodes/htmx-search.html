{{- /*
  HTMX Search Bar Component

  Client-side search input that triggers server search via HTMX.
  Uses debouncing to avoid excessive requests.
  */
-}}


<div class="search-container max-w-2xl mx-auto">
  <div class="relative">
    <input
      type="search"
      name="q"
      placeholder="Search articles..."
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      hx-get="/search"
      hx-trigger="keyup changed delay:500ms, search"
      hx-target="#search-results"
      hx-indicator="#search-indicator"
      autocomplete="off"
    />
    <div id="search-indicator" class="htmx-indicator absolute right-3 top-3">
      <svg
        class="animate-spin h-5 w-5 text-blue-500"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    </div>
  </div>

  <div id="search-results" class="mt-6">
    {{- partial "fragments/search-results.html" . -}}
  </div>
</div>

<style>
  .htmx-indicator {
    display: none;
  }

  .htmx-request .htmx-indicator {
    display: inline-block;
  }
</style>
